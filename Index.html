<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple की दुनिया</title>
    <style>
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
            width: 100%;
            text-align: center;
        }
        main {
            padding: 20px;
            max-width: 800px;
            margin-top: 40px;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            font-weight: 600;
            color: #1d1d1f;
        }
        h2 {
            font-size: 24px;
            color: #86868b;
        }
        p {
            font-size: 17px;
            line-height: 1.47059;
            color: #86868b;
        }
    </style>
</head>
<body>
    <header>
        <h1>Apple</h1>
    </header>
    <main>
        <h1>अभिनव तकनीक, असाधारण अनुभव</h1>
        <h2>हमारे नवीनतम उत्पादों की खोज करें।</h2>
        <p>यहाँ आपको Apple के नवीनतम डिज़ाइन और инновациям के बारे में जानकारी मिलेगी।</p>
    </main>
</body>
</html>
